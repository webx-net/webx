<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebX todos with HTMX</title>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
          integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
          crossorigin="anonymous" defer></script>
  <style>
    body { font: 1rem system-ui, sans-serif; max-width: 48rem; margin: 3rem auto; padding: 0 1rem; }
    form, li { display: flex; gap: .5rem; margin: 1rem 0; align-items: center; flex-wrap: wrap; }
    input, button { font: inherit; padding: .5rem; }
    input[type=text], .todo-title { flex: 1; min-width: 8rem; }
    ul { list-style: none; padding: 0; }
    #status { min-height: 1.5rem; }
  </style>
</head>
<body>
  <main id="todo-app" hx-target="#todo-panel" hx-swap="outerHTML" hx-disabled-elt="#todo-app button">
    <h1>WebX todos with HTMX</h1>
    <p>Add a todo, edit its title or completion state, save it, or delete it.</p>
    <section id="todo-panel" hx-get="/todos" hx-trigger="load">Loading todos…</section>
    <noscript>Enable JavaScript to use this HTMX example.</noscript>
    <p>This demo keeps data in memory. Restarting or editing the global code resets it.</p>
  </main>
  <script>
    // POST keeps its URL parameter; PUT submits the edit form body normally.
    document.body.addEventListener('htmx:configRequest', event => {
      const form = event.detail.elt;
      if (!form.matches('form[data-title-route]')) return;
      event.detail.path += '/' + encodeURIComponent(form.elements.title.value);
    });
  </script>
</body>
</html>
